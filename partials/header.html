<header id="seccion-encabezado" class="az-header">
  <div id="contenedor-encabezado" class="container">
    <!-- LOGOTIPO Y BOTÓN DEL MENÚ MÓVIL -->
    <div id="seccion-logotipo" class="az-header-left">
      <span id="logo-sigss" class="az-logo">
        <img src="/assets/images/Logo_SIGSS.jpeg" alt="SIGSS">
      </span>
      <a href="#" id="boton-menu-movil" class="az-header-menu-icon d-lg-none" aria-label="Abrir menú">
        <span></span>
      </a>
    </div>
    <nav id="seccion-navegacion" class="az-header-menu">
      <div id="encabezado-menu-movil" class="az-header-menu-header">
        <span id="logo-sigss-movil" class="az-logo">
          <span></span> SIGSS
        </span>
        <a href="#" id="boton-cerrar-menu" class="close" aria-label="Cerrar menú">
          &times;
        </a>
      </div>
      <ul id="menu-principal" class="nav"></ul>
    </nav>
    <div id="seccion-acciones-usuario" class="az-header-right">
      <div id="seccion-perfil" class="dropdown az-profile-menu">
        <a href="#" id="boton-perfil" class="az-img-user" aria-label="Perfil del usuario">
          <img src="/assets/images/usuario.png" alt="Foto de perfil">
        </a>
        <div id="menu-perfil" class="dropdown-menu">
          <div id="encabezado-perfil-movil" class="az-dropdown-header d-sm-none">
            <a href="#" id="volver-perfil" class="az-header-arrow" aria-label="Volver">
              <i class="icon ion-md-arrow-back"></i>
            </a>
          </div>
          <div id="informacion-perfil" class="az-header-profile">
            <div id="imagen-perfil" class="az-img-user">
              <img src="/assets/images/usuario.png" alt="Foto de perfil">
            </div>
            <h6 id="nombre-usuario">Nombre del usuario</h6>
            <span id="rol-usuario">Tipo de usuario</span>
          </div>
          <a href="#" id="opcion-mi-perfil" class="dropdown-item">
            <i class="typcn typcn-user-outline"></i>
            Mi perfil
          </a>
          <a href="#" id="opcion-cerrar-sesion" class="dropdown-item">
            <i class="typcn typcn-power-outline"></i>
            Cerrar sesión
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
