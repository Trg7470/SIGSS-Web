<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- Meta -->
  <meta name="description" content="Responsive Bootstrap 4 Dashboard Template">
  <meta name="author" content="BootstrapDash">

  <title>SIGSS - Login</title>

  <!-- vendor css -->
  <link href="/lib/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="/lib/ionicons/css/ionicons.min.css" rel="stylesheet">
  <link href="/lib/typicons.font/typicons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/popup.css">
  <link rel="stylesheet" href="/css/login.css">

</head>

<body class="az-body">

  <!-- Encabezado / Header Superior -->
  <header class="header-superior">
    <div class="encabezado">
      <img src="/assets/images/SSD_Servicios_Durango_Azul.jpeg" class="logo" alt="Logo izquierdo" width="95"
        height="125" fetchpriority="high">
      <div class="titulo">
        <h2>SERVICIOS DE SALUD DE DURANGO</h2>
        <p>CESSA DR. ISAURO VENZOR, GÓMEZ PALACIO, DGO.</p>
      </div>
      <img src="/assets/images/DURANGO_Azul.png" class="logo" alt="Logo derecho" width="135" height="80"
        fetchpriority="high">
    </div>
  </header>

  <div class="az-signin-wrapper">
    <div class="az-card-signin">
      <img src="/assets/images/Logo_SIGSS.jpeg" class="az-logo" alt="SIGSS" width="80" height="106">
      <div class="az-signin-header">
        <h2>Bienvenido a SIGSS</h2>
        <h3>SISTEMA INTEGRAL DE GESTIÓN</h3>
        <h3>Y SEGUIMIENTO DE LA SALUD</h3>
        <h4>Ingresa tus credenciales para acceder al sistema. </h4>

        <form id="form-login">
          <div class="form-group">
            <label>Usuario</label>
            <input type="text" class="form-control" placeholder="Ingresa tu nombre de usuario" id="usuario">
          </div><!-- form-group -->
          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" class="form-control" placeholder="Ingresa tu contraseña" id="password">
          </div><!-- form-group -->
          <button class="btn btn-az-primary btn-block" id="Iniciar-Sesion">Iniciar Sesión</button>
        </form>
      </div>
    </div>
  </div>
  <div id="modalPopup" class="popup-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-titulo"
    aria-describedby="modal-mensaje">
    <div class="popup-card">
      <!-- Botón cerrar -->
      <button id="popup-cerrar" class="popup-cerrar" type="button" aria-label="Cerrar diálogo">
        &times;
      </button>
      <div id="modal-icono" class="popup-icono">
        <i class="fas fa-circle-xmark"></i>
      </div>
      <h3 id="modal-titulo">Generando documento</h3>
      <p id="modal-mensaje">
        Espere un momento, por favor...
      </p>
      <div id="modal-botones-confirmacion" class="popup-botones-confirmacion">
        <button id="modal-cancelar" type="button">
          Revisar datos
        </button>
        <button id="modal-confirmar" type="button">
          Sí, registrar
        </button>
      </div>
      <button id="modal-boton" class="popup-boton" type="button">
        Aceptar
      </button>
    </div>
  </div>
  <script src="/lib/jquery/jquery.min.js"></script>
  <script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/popup.js"></script>
  <script src="/lib/ionicons/ionicons.js"></script>
  <script type="module" src="/js/login.js"></script>
</body>

</html>
