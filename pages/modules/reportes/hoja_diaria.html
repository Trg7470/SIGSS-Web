<!doctype html>
<html lang="es-MX">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="Sistema Integral de Gestión de Servicios de Salud" />
  <meta name="author" content="SIGSS" />
  <title>SIGSS | Generación de reportes</title>

  <!-- Hojas de estilo de iconos (raíz = ../../../) -->
  <link href="../../../lib/fontawesome-free/css/all.min.css" rel="stylesheet" />
  <link href="../../../lib/ionicons/css/ionicons.min.css" rel="stylesheet" />
  <link href="../../../lib/typicons.font/typicons.css" rel="stylesheet" />
  <link href="../../../lib/flag-icon-css/css/flag-icon.min.css" rel="stylesheet" />

  <!-- Hojas de estilo de la plantilla -->
  <link rel="stylesheet" href="../../../lib/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/popup.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/modal.css" />
    <link rel="stylesheet" href="../../../css/consulta_externa.css" />
  <!-- Reaprovechamos las tarjetas/tabla de "Historial de consultas" (mismas
       clases hc-*); aquí solo se agrega lo propio de esta pantalla. -->
  <link rel="stylesheet" href="../../../css/consultas_registros.css" />
  <link rel="stylesheet" href="../../../css/reportes_hoja_diaria.css" />
</head>

<body id="pagina-sigss">
  <!-- ================================================== -->
  <!-- ENCABEZADO PRINCIPAL                               -->
  <!-- ================================================== -->
    <div data-layout="/partials/header.html"></div>

  <!-- ================================================== -->
  <!-- CONTENIDO PRINCIPAL                                -->
  <!-- ================================================== -->
  <main id="seccion-contenido" class="az-content az-content-dashboard">
    <div id="contenedor-contenido" class="container">
      <div id="contenido-dashboard" class="az-content-body">

        <section id="seccion-bienvenida" class="az-dashboard-one-title">
          <div id="informacion-bienvenida">
            <h1 id="titulo-bienvenida" class="az-dashboard-title">Generación de reportes</h1>
            <p id="descripcion-bienvenida" class="az-dashboard-text">Genera la hoja diaria (Excel o PDF) de un
              módulo para un día específico.</p>
          </div>
          <div id="informacion-adicional" class="az-content-header-right">
            <div id="informacion-fecha" class="media">
              <div class="media-body">
                <label id="fecha">Fecha</label>
                <h6 id="hora">--/--/----</h6>
              </div>
            </div>
          </div>
        </section>

        <section id="seccion-reporte-hoja-diaria" aria-label="Generación de la hoja diaria">
          <div id="contenedor-reporte" class="sigss-formulario">

            <!-- Filtros de búsqueda -->
            <div class="shadow card hc-card-filtros mt-4" id="tarjeta-filtros">
              <div class="card-header hc-card-header" id="encabezado-filtros" data-toggle="collapse"
                href="#cuerpo-filtros" role="button" aria-expanded="true" aria-controls="cuerpo-filtros">
                <span class="hc-card-header-titulo">
                  Filtros de búsqueda
                </span>
                <i class="fa-solid fa-chevron-up hc-chevron" id="icono-colapso-filtros"></i>
              </div>
              <div id="cuerpo-filtros" class="collapse show" aria-labelledby="encabezado-filtros">
                <div class="card-body">
                  <form id="form-filtros-reporte" novalidate>
                    <div class="form-row">
                      <div class="form-group col-md-6">
                        <label for="filtro-modulo">Módulo</label>
                        <select class="form-control" id="filtro-modulo" required>
                          <option value="" selected disabled>Selecciona un módulo</option>
                          <option value="consulta-externa">Consulta externa</option>
                          <option value="planificacion-familiar">Planificación familiar</option>
                          <option value="salud-bucal">Salud bucal</option>
                          <option value="detecciones">Detecciones</option>
                        </select>
                      </div>
                      <div class="form-group col-md-6">
                        <label for="filtro-fecha">Fecha</label>
                        <input type="date" class="form-control" id="filtro-fecha" required />
                      </div>
                    </div>
                    <div class="form-row justify-content-end hc-fila-botones">
                      <button type="button" class="btn btn-outline-secondary mr-2" id="boton-limpiar-filtros">
                        Limpiar
                      </button>
                      <button type="submit" class="btn btn-primary" id="boton-buscar-reporte">
                        <i class="fa-solid fa-magnifying-glass mr-1"></i>
                        Consultar
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>

            <!-- Resultados -->
            <div class="shadow card hc-card-resultados mt-4 d-none" id="tarjeta-resultados">
              <div class="card-header hc-card-header rd-card-header-resultados">
                <span class="hc-card-header-titulo">
                  Consultas a incluir en el reporte
                  (<span id="contador-resultados">0</span> registros)
                </span>
                <span class="rd-info-hojas" id="texto-info-hojas"></span>
              </div>
              <div class="card-body p-0">
                <div class="table-responsive hc-tabla-wrapper">
                  <table class="table table-hover hc-tabla-resultados mb-0" id="tabla-reporte">
                    <colgroup>
                      <col style="width: 16%;" />
                      <col style="width: 16%;" />
                      <col style="width: 14%;" />
                      <col style="width: 32%;" />
                      <col style="width: 22%;" />
                    </colgroup>
                    <thead>
                      <tr>
                        <th scope="col">Folio de receta</th>
                        <th scope="col">Expediente</th>
                        <th scope="col">Fecha consulta</th>
                        <th scope="col">Paciente</th>
                        <th scope="col">CURP del paciente</th>
                      </tr>
                    </thead>
                    <tbody id="cuerpo-tabla-reporte"></tbody>
                  </table>
                </div>
              </div>
              <div class="card-footer hc-card-footer rd-card-footer-acciones">
                <span class="text-muted small" id="texto-resumen-reporte"></span>
                <div id="contenedor-botones-exportar" class="rd-botones-exportar">
                  <button type="button" class="btn btn-outline-primary" id="boton-generar-excel" disabled>
                    <i class="fa-solid fa-file-excel mr-1"></i>
                    Generar Excel
                  </button>
                  <button type="button" class="btn btn-primary" id="boton-generar-pdf" disabled>
                    <i class="fa-solid fa-file-pdf mr-1"></i>
                    Generar PDF
                  </button>
                </div>
              </div>
            </div>

          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- ================================================== -->
  <!-- PIE DE PÁGINA                                      -->
  <!-- ================================================== -->
    <div data-layout="/partials/footer.html"></div>

  <!-- Ventanas modales (popup de estado + modal genérico) -->
  <div data-layout="/partials/modales.html"></div>

  <!-- ================================================== -->
  <!-- BIBLIOTECAS JAVASCRIPT                             -->
  <!-- ================================================== -->
  <script src="/js/layout.js"></script>
  <script src="../../../lib/jquery/jquery.min.js"></script>
  <script src="../../../lib/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../../../lib/ionicons/ionicons.js"></script>
  <script src="../../../js/popup.js"></script>


  <!-- Lógica propia de SIGSS -->
  <script type="module" src="../../../js/reportes_hoja_diaria.js"></script>
  <script src="../../../js/dashboard.js"></script>
  <script src="../../../js/clock.js"></script>
</body>

</html>
