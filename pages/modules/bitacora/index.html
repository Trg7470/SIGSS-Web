<!doctype html>
<html lang="es-MX">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Sistema Integral de Gestión de Servicios de Salud" />
    <meta name="author" content="SIGSS" />
    <title>SIGSS | Bitácora</title>

    <link href="/lib/fontawesome-free/css/all.min.css" rel="stylesheet" />
    <link href="/lib/ionicons/css/ionicons.min.css" rel="stylesheet" />
    <link href="/lib/typicons.font/typicons.css" rel="stylesheet" />
    <link href="/lib/flag-icon-css/css/flag-icon.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/popup.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/modal.css" />
    <link rel="stylesheet" href="/css/bitacora.css" />
</head>

<body id="pagina-sigss">
    <div data-layout="/partials/header.html"></div>
    <main id="seccion-contenido" class="az-content az-content-dashboard">
        <div id="contenedor-contenido" class="container">
            <div id="contenido-dashboard" class="az-content-body">

                <section id="seccion-bienvenida" class="az-dashboard-one-title">
                    <div id="informacion-bienvenida">
                        <h1 id="titulo-bienvenida" class="az-dashboard-title">Bitácora</h1>
                        <p id="descripcion-bienvenida" class="az-dashboard-text">Consulta las acciones realizadas por
                            los
                            usuarios dentro del sistema.</p>
                    </div>
                    <div id="informacion-adicional" class="az-content-header-right">
                        <div id="informacion-fecha" class="media">
                            <div class="media-body">
                                <label id="fecha">Fecha</label>
                                <h6 id="hora">--/--/----</h6>
                            </div>
                        </div>
                    </div>
                </section>

                <section id="seccion-bitacora" aria-label="Bitácora del sistema">
                    <div id="contenedor-bitacora" class="sigss-formulario">

                        <div class="shadow card hc-card-filtros mt-4" id="tarjeta-filtros">
                            <div class="card-header hc-card-header" id="encabezado-filtros" data-toggle="collapse"
                                href="#cuerpo-filtros" role="button" aria-expanded="true"
                                aria-controls="cuerpo-filtros">
                                <span class="hc-card-header-titulo">
                                    <i class="fa-solid fa-filter mr-2"></i>Filtros de búsqueda
                                </span>
                                <i class="fa-solid fa-chevron-up hc-chevron" id="icono-colapso-filtros"></i>
                            </div>
                            <div id="cuerpo-filtros" class="collapse show" aria-labelledby="encabezado-filtros">
                                <div class="card-body">
                                    <form id="form-filtros-bitacora" novalidate>
                                        <div class="form-row">
                                            <div class="form-group col-md-3">
                                                <label for="filtro-fecha-inicial">Fecha inicial</label>
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i
                                                                class="fa-solid fa-calendar-days"></i></span>
                                                    </div>
                                                    <input type="date" class="form-control" id="filtro-fecha-inicial"
                                                        required />
                                                </div>
                                            </div>
                                            <div class="form-group col-md-3">
                                                <label for="filtro-fecha-final">Fecha final</label>
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i
                                                                class="fa-solid fa-calendar-days"></i></span>
                                                    </div>
                                                    <input type="date" class="form-control" id="filtro-fecha-final"
                                                        required />
                                                </div>
                                            </div>
                                            <div class="form-group col-md-3">
                                                <label for="filtro-usuario">Usuario</label>
                                                <select class="form-control" id="filtro-usuario">
                                                    <option value="" selected>Todos los usuarios</option>
                                                </select>
                                            </div>
                                            <div class="form-group col-md-3">
                                                <label for="filtro-modulo">Módulo</label>
                                                <select class="form-control" id="filtro-modulo">
                                                    <option value="" selected>Todos los módulos</option>
                                                    <option value="pacientes">Pacientes</option>
                                                    <option value="consulta-externa">Consulta externa</option>
                                                    <option value="salud-bucal">Salud bucal</option>
                                                    <option value="planificacion-familiar">Planificación familiar
                                                    </option>
                                                    <option value="detecciones">Detecciones</option>
                                                    <option value="reportes">Reportes</option>
                                                    <option value="usuarios">Usuarios</option>
                                                    <option value="sesion">Sesión</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-row">
                                            <div class="form-group col-md-12">
                                                <label for="filtro-busqueda">Acción o tabla afectada</label>
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i
                                                                class="fa-solid fa-magnifying-glass"></i></span>
                                                    </div>
                                                    <input type="text" class="form-control" id="filtro-busqueda"
                                                        placeholder="Ej. CREAR, Usuarios, ACTUALIZAR..." />
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-row justify-content-end hc-fila-botones">
                                            <button type="button" class="btn btn-outline-primary mr-2"
                                                id="boton-mis-acciones">
                                                <i class="fa-solid fa-user mr-1"></i>Ver mis acciones
                                            </button>
                                            <button type="button" class="btn btn-outline-secondary mr-2"
                                                id="boton-limpiar-filtros">
                                                <i class="fa-solid fa-eraser mr-1"></i>Limpiar
                                            </button>
                                            <button type="submit" class="btn btn-primary mr-2" id="boton-buscar-bitacora">
                                                <i class="fa-solid fa-magnifying-glass mr-1"></i>
                                                Buscar
                                            </button>
                                            <button type="button" class="btn btn-outline-success mr-2"
                                                id="boton-exportar-excel">
                                                <i class="fa-solid fa-file-excel mr-1"></i> Generar Excel
                                            </button>
                                            <button type="button" class="btn btn-outline-danger mr-2"
                                                id="boton-exportar-pdf">
                                                <i class="fa-solid fa-file-pdf mr-1"></i>Generar PDF
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div class="shadow card hc-card-resultados mt-4" id="tarjeta-resultados">
                            <div class="card-header hc-card-header">
                                <span class="hc-card-header-titulo">
                                    Resultados
                                    (<span id="contador-resultados">0</span> registros)
                                </span>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive hc-tabla-wrapper">
                                    <table class="table table-hover hc-tabla-resultados mb-0" id="tabla-bitacora">
                                        <colgroup>
                                            <col style="width: 16%;" />
                                            <col style="width: 22%;" />
                                            <col style="width: 16%;" />
                                            <col style="width: 24%;" />
                                            <col style="width: 22%;" />
                                        </colgroup>
                                        <thead>
                                            <tr>
                                                <th scope="col">Fecha y hora</th>
                                                <th scope="col">Usuario</th>
                                                <th scope="col">Módulo</th>
                                                <th scope="col">Acción</th>
                                                <th scope="col">Tabla afectada</th>
                                            </tr>
                                        </thead>
                                        <tbody id="cuerpo-tabla-bitacora"></tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="card-footer hc-card-footer">
                                <span class="text-muted small" id="texto-paginacion">Mostrando 0 a 0 de 0
                                    registros</span>
                                <nav aria-label="Paginación de la bitácora">
                                    <ul class="pagination pagination-sm mb-0" id="paginacion-bitacora">
                                        <li class="page-item disabled" id="pagina-primera">
                                            <a class="page-link" href="#" tabindex="-1" aria-label="Primera página"><i
                                                    class="fa-solid fa-angles-left"></i></a>
                                        </li>
                                        <li class="page-item disabled" id="pagina-anterior">
                                            <a class="page-link" href="#" tabindex="-1" aria-label="Página anterior"><i
                                                    class="fa-solid fa-angle-left"></i></a>
                                        </li>
                                        <li class="page-item active" aria-current="page"><a class="page-link"
                                                href="#">1</a></li>
                                        <li class="page-item disabled" id="pagina-siguiente">
                                            <a class="page-link" href="#" tabindex="-1" aria-label="Página siguiente"><i
                                                    class="fa-solid fa-angle-right"></i></a>
                                        </li>
                                        <li class="page-item disabled" id="pagina-ultima">
                                            <a class="page-link" href="#" tabindex="-1" aria-label="Última página"><i
                                                    class="fa-solid fa-angles-right"></i></a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>

                    </div>
                </section>
            </div>
        </div>
    </main>

    <div data-layout="/partials/footer.html"></div>
    <div data-layout="/partials/modales.html"></div>

    <script src="/js/layout.js"></script>
    <script src="/lib/jquery/jquery.min.js"></script>
    <script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/lib/ionicons/ionicons.js"></script>
    <script src="/js/popup.js"></script>
    <script type="module" src="/js/bitacora.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/clock.js"></script>
</body>

</html>
